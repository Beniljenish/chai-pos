name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chai
          POSTGRES_PASSWORD: chai
          POSTGRES_DB: chai_pos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chai"
          --health-interval 2s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://chai:chai@localhost:5432/chai_pos_test
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Migrations match models
        run: alembic upgrade head && alembic check
      - name: Tests
        run: pytest
