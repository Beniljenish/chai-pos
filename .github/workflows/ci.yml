name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    # Pinned, not ubuntu-latest: a runner image upgrade should be a deliberate PR,
    # not something that silently breaks CI one morning.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chai
          POSTGRES_PASSWORD: chai
          POSTGRES_DB: chai_pos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chai"
          --health-interval 2s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://chai:chai@localhost:5432/chai_pos_test
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - name: Lint and format
        run: ruff check . && ruff format --check .
      - name: Migrations round-trip (up, all the way down, up again) and match models
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint and type-check
        run: npm run lint && npm run typecheck
      - name: Unit tests (incl. GST vectors and the Python cross-check)
        run: npm test
      - name: Production build
        run: npm run build

  # The real thing: backend + Postgres + built app in a real browser.
  end-to-end:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chai
          POSTGRES_PASSWORD: chai
          POSTGRES_DB: chai_pos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chai"
          --health-interval 2s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://chai:chai@localhost:5432/chai_pos
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
      CORS_ORIGINS: '["http://localhost:4173"]'
      SEED_PASSWORD: e2e-password-123
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start backend (migrate, seed placeholder shop, serve)
        working-directory: backend
        run: |
          pip install .
          alembic upgrade head
          python -m scripts.seed
          nohup uvicorn app.main:app --port 8000 > ../uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
      - name: Install app and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: "Gate: 20 offline bills over a lossy network reach the real server once"
        working-directory: frontend
        env:
          GATE_API_URL: http://localhost:8000/api/v1
          GATE_PASSWORD: e2e-password-123
        run: npm run test:gate
      - name: Build and serve the app
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000/api/v1
        run: |
          npm run build
          nohup npx vite preview --port 4173 --strictPort > ../preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4173 > /dev/null && break; sleep 1; done
      - name: End-to-end in Chromium
        working-directory: frontend
        env:
          E2E_PASSWORD: e2e-password-123
        run: npx playwright test
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            frontend/e2e-screenshots/
            frontend/test-results/
          if-no-files-found: ignore
      - name: Server logs on failure
        if: failure()
        run: tail -100 uvicorn.log preview.log || true
