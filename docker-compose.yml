# Local development: the database, the API and the app, all on this computer.
#   docker compose up --build        then open http://localhost:5173
# Code changes reload by themselves (backend/app and frontend/src are mounted).
# Nothing here reaches staging: the database is a local Postgres in a volume.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: chai
      POSTGRES_PASSWORD: chai
      POSTGRES_DB: chai_pos
    ports: ["5433:5432"]  # 5433 here so a Postgres already on your computer (5432) does not clash
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chai -d chai_pos"]
      interval: 2s
      retries: 20

  api:
    build:
      context: ./backend
      args: { EXTRAS: demo }
    environment:
      DATABASE_URL: postgresql+psycopg://chai:chai@db:5432/chai_pos
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789}
      # Local testing only: log in with the phone number alone. The API refuses to start
      # with this on unless its database is this compose 'db' (or localhost).
      DEV_LOGIN: "true"
      FAKE_PAYMENTS: "true"
      # Local testing only: simple rules stand in for the AI model. A real key (below) replaces them.
      FAKE_AI: "true"
      # Local testing only: phone codes (sign-up, forgot password) appear on the page, nothing is sent.
      FAKE_SMS: "true"
    # Phone-notification keys for this computer only (./local.sh makes the file; it is not committed),
    # and, if you want to try the real AI, your own key in .local-ai.env as ANTHROPIC_API_KEY=... (not committed).
    env_file:
      - path: .local-vapid.env
        required: false
      - path: .local-ai.env
        required: false
    command: >
      sh -c "alembic upgrade heads &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    # node_modules stays inside the container, so it never clashes with your own
    volumes: ["./frontend:/app", "/app/node_modules"]
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
