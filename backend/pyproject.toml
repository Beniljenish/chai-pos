[project]
name = "chai-pos-backend"
version = "0.1.0"
description = "Tea & juice shop POS - backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "tzdata>=2024.1",  # IANA timezones even on slim Docker images
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]  # tests/, scripts/, alembic/ are not part of the installed package

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]  # generated files

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the intended pattern

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # our alembic/ folder is not the package

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]  # S311: seeded random is for reproducible tests
"scripts/**" = ["S105", "S106", "S311"]  # seeded random for test data
